version: '3.1'

services:
  wordpress:
    image: meuwordpress:6.8.1-php8.2-apache  # Use a imagem gerada localmente
    ports:
      - "7000:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress  # Corrigido o nome do usuário
      WORDPRESS_DB_PASSWORD: Mamede12
      WORDPRESS_DB_NAME: banco
    volumes:
      - wordpress_data:/var/www/html
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
    depends_on:
      - db
      - redis
    tty: true
    stdin_open: true
    networks:
      - npm_public
      - banco

  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Mamede12
      MYSQL_DATABASE: banco
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: Mamede12
    ports:
      - "3306:3306"
    tty: true
    stdin_open: true
    networks:
      - banco

  phpmyword:
    image: phpmyadmin/phpmyadmin:5.1
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: Mamede12
    tty: true
    stdin_open: true
    networks:
      - npm_public
      - banco


  redis:
    image: redis:6.0
    ports:
      - "6379:6379"
    networks:
      - npm_public

volumes:
  wordpress_data:
  db_data:

networks:
  npm_public:
    external: true
  banco:
    external: true
